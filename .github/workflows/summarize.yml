name: 영상 요약 추가 및 사이트 배포

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "요약할 유튜브 영상 주소 (여러 개는 공백으로 구분, 비워 두면 사이트만 다시 배포)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["index.html", "videos.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.urls != '' }}
        with:
          python-version: "3.12"

      - name: 영상 요약 만들기
        if: ${{ github.event.inputs.urls != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-1.5-flash
          URLS: ${{ github.event.inputs.urls }}
        run: |
          pip install google-genai
          python scripts/summarize.py $URLS

      - name: 변경사항 저장
        if: ${{ github.event.inputs.urls != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.js
          if ! git diff --cached --quiet; then
            git commit -m "영상 요약 추가"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
