name: 영상 요약 추가 및 사이트 배포

on:
  schedule:
    # 2시간마다 한 번 (하루 12번). 구글이 혼잡해서 실패한 영상을 다음 실행에서 다시 시도하기 위해 자주 돌린다.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "영상 주소를 넣으면 그 영상을 요약한다(여러 개는 공백으로 구분). 비워 두면 5개 채널에서 새 영상을 찾아 요약한다. 그 밖의 명령: 삭제:영상주소(또는 제목 속 단어) / 브리핑 (날짜는 브리핑:2026-11-14) / 주간 (주간:2026-11-14) / 종목(종목 종합 다시 만들기) / 정리(긴 결론 줄이기, 숫자에 지표 이름 붙이기) / 진단(채널별 수집 현황 보기) / 복구(경제 무관으로 빠진 영상을 다시 요약 대상으로) / 자막테스트(자막으로 요약이 되는지 시험, 저장 안 함)"
        required: false
        default: ""
      note_key:
        description: "한마디 코멘트를 달 대상. 날짜(2026-11-14), 주간:날짜(그 날짜가 속한 주), 또는 영상 주소. 아래 칸을 비워 두면 그 코멘트를 지운다."
        required: false
        default: ""
      note_text:
        description: "한마디 코멘트 내용 (한 줄)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["index.html", "videos.js", "briefs.js", "notes.js", "stocks.js", "scripts/pages.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ github.event_name != 'push' }}
        with:
          python-version: "3.12"

      - name: 영상 요약 만들기
        id: summarize
        if: ${{ github.event_name != 'push' }}
        timeout-minutes: 80
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # 없어도 된다 (유튜브 RSS가 계속 막힐 때만 사용)
          URLS: ${{ github.event.inputs.urls }}
          NOTE_KEY: ${{ github.event.inputs.note_key }}
          NOTE_TEXT: ${{ github.event.inputs.note_text }}
          # ---- 조절할 수 있는 값 ----
          DAILY_BUDGET_MIN: "450"   # 하루에 요약할 영상 시간의 합(분). 무료 한도(하루 8시간)보다 조금 적게
          MAX_VIDEO_MIN: "90"       # 이 길이(분)보다 긴 영상은 건너뛴다
          MAX_AGE_DAYS: "2"         # 올라온 지 이 일수가 지난 영상은 처리하지 않는다
          MAX_PER_RUN: "6"          # 한 번 실행에서 최대로 요약할 영상 수
          TOPIC_FILTER: "1"         # 1이면 경제와 관련 없는 영상은 제외한다 (0이면 모두 요약)
          TOPIC_STRICT: "1"         # 1이면 경제와 무관한 게 분명한 영상만 제외, 0이면 그보다 더 너그럽게
          BRIEF: "1"                # 1이면 하루치 종합 브리핑을 만든다
          BRIEF_MIN_VIDEOS: "3"     # 그날 영상이 이만큼 모이면 브리핑을 처음 만든다
          BRIEF_MIN_NEW: "3"        # 브리핑 후 영상이 이만큼 늘면 다시 만든다
          WEEKLY: "1"               # 1이면 주간 브리핑도 만든다
          WEEKLY_MIN_DAYS: "3"      # 일간 브리핑이 이만큼 모인 주부터 주간 브리핑을 만든다
          STOCK_DIGEST: "1"         # 1이면 여러 영상에서 언급된 종목의 종합 정리를 만든다
          STOCK_PER_RUN: "2"        # 한 번 실행에서 새로 정리할 종목 수
          VIDEO_FPS: "0.2"          # 영상 화면을 몇 초에 한 장 볼지 (0.2 = 5초에 한 장, 1 = 매초). 소리는 다 듣는다. 낮을수록 한도를 덜 쓴다
          LITE_AFTER_HOURS: "3"     # 좋은 모델이 막혔을 때, 올라온 지 이 시간이 지난 영상부터 lite 모델로 요약한다
        run: |
          pip install google-genai youtube-transcript-api
          python scripts/summarize.py "$URLS"

      - name: 홈 대시보드와 검색용 개별 페이지 만들기 (브리핑·주간·종목, 사이트맵)
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://econo-tube-note.github.io/econo-tube-note
        run: python3 scripts/pages.py

      - name: 커뮤니티 데이터베이스 깨우기 (무료 Supabase가 1주일 쉬면 멈추는 것을 막는다)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          if [ -f config.js ]; then
            URL=$(grep -o 'url:"[^"]*"' config.js | cut -d'"' -f2)
            KEY=$(grep -o 'key:"[^"]*"' config.js | cut -d'"' -f2)
            if [ -n "$URL" ] && [ -n "$KEY" ]; then
              curl -s -o /dev/null -w "Supabase 응답: %{http_code}\n" "$URL/rest/v1/posts?select=id&limit=1" -H "apikey: $KEY"
            fi
          fi

      - name: 변경사항 저장
        id: commit
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in index.html videos.js briefs.js notes.js stocks.js state.json archive.json channels.json sitemap.xml pages.json brief week stock; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet -- index.html videos.js briefs.js notes.js stocks.js sitemap.xml brief week stock; then
            echo "videos=false" >> "$GITHUB_OUTPUT"
          else
            echo "videos=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "영상 요약 자동 갱신"
            git push
          fi

      - name: 데이터 파일에 버전 붙이기 (브라우저가 예전 파일을 계속 쓰지 않게)
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
        run: |
          V=$(date +%s)
          sed -i -E "s/(videos|briefs|notes|stocks|config)\.js(\?v=[0-9]+)?\"/\1.js?v=$V\"/g" index.html
          grep -o '<script src="[a-z]*\.js?v=[0-9]*"' index.html

      - uses: actions/configure-pages@v5
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
