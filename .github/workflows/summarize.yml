name: 영상 요약 추가 및 사이트 배포

on:
  schedule:
    # 2시간마다 한 번 (하루 12번). 구글이 혼잡해서 실패한 영상을 다음 실행에서 다시 시도하기 위해 자주 돌린다.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "영상 주소를 넣으면 그 영상을 요약한다(여러 개는 공백으로 구분). 비워 두면 5개 채널에서 새 영상을 찾아 요약한다. 그 밖의 명령: 삭제:영상주소(또는 제목 속 단어) / 브리핑 (날짜는 브리핑:2026-11-14) / 주간 (주간:2026-11-14) / 종목(종목 종합 다시 만들기) / 정리(긴 결론 줄이기, 숫자에 지표 이름 붙이기) / 진단(채널별 수집 현황 보기) / 복구(경제 무관으로 빠진 영상을 다시 요약 대상으로) / 자막테스트(자막으로 요약이 되는지 시험, 저장 안 함)"
        required: false
        default: ""
      note_key:
        description: "한마디 코멘트를 달 대상. 날짜(2026-11-14), 주간:날짜(그 날짜가 속한 주), 또는 영상 주소. 아래 칸을 비워 두면 그 코멘트를 지운다."
        required: false
        default: ""
      note_text:
        description: "한마디 코멘트 내용 (한 줄)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["index.html", "videos.js", "briefs.js", "notes.js", "stocks.js", "scripts/pages.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: ${{ github.event_name != 'push' }}
        with:
          python-version: "3.12"

      - name: 영상 요약 만들기
        id: summarize
        if: ${{ github.event_name != 'push' }}
        timeout-minutes: 80
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash   # 3.8-flash는 무료 한도가 없어 뺐다 (성공 0회)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # 스레드 초안을 텔레그램으로 받기 (없어도 된다)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL: "@marketraven"   # 공개 채널: 평일 오전 시황(11시대)·저녁 브리핑(17시대), 토요일 저녁 주간 브리핑
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}   # 자막 시험용 (유튜브 부계정 쿠키). 없어도 된다   # 없어도 된다 (유튜브 RSS가 계속 막힐 때만 사용)
          URLS: ${{ github.event.inputs.urls }}
          NOTE_KEY: ${{ github.event.inputs.note_key }}
          NOTE_TEXT: ${{ github.event.inputs.note_text }}
          # ---- 조절할 수 있는 값 ----
          SLOT_BUDGET_MIN: "170,0,200,100"  # 영상 방식 예산(분): 저녁17~24시, 새벽0~7시, 오전7~12시, 오후12~17시. 오후 5시에 초기화. 안 쓴 몫은 다음 시간대로 넘어간다 (합계는 무료 한도 480분보다 작게)
          LONG_VIDEO_MIN: "75"      # 이보다 긴 영상은 짧은 영상을 다 처리한 뒤에 한다
          MAX_VIDEO_MIN: "90"       # 이 길이(분)보다 긴 영상은 건너뛴다
          MAX_AGE_DAYS: "2"         # 올라온 지 이 일수가 지난 영상은 처리하지 않는다
          MAX_PER_RUN: "6"          # 한 번 실행에서 최대로 요약할 영상 수
          TOPIC_FILTER: "1"         # 1이면 경제와 관련 없는 영상은 제외한다 (0이면 모두 요약)
          TOPIC_STRICT: "1"         # 1이면 경제와 무관한 게 분명한 영상만 제외, 0이면 그보다 더 너그럽게
          BRIEF: "1"                # 1이면 하루치 종합 브리핑을 만든다
          BRIEF_MIN_VIDEOS: "3"     # 그날 영상이 이만큼 모이면 브리핑을 처음 만든다
          BRIEF_MIN_NEW: "3"        # 브리핑 후 영상이 이만큼 늘면 다시 만든다
          WEEKLY: "1"               # 1이면 주간 브리핑도 만든다
          WEEKLY_MIN_DAYS: "3"      # 일간 브리핑이 이만큼 모인 주부터 주간 브리핑을 만든다
          STOCK_DIGEST: "1"         # 1이면 여러 영상에서 언급된 종목의 종합 정리를 만든다
          STOCK_PER_RUN: "2"        # 한 번 실행에서 새로 정리할 종목 수
          VIDEO_FPS: "0.2"          # 영상 화면을 몇 초에 한 장 볼지 (0.2 = 5초에 한 장, 1 = 매초). 소리는 다 듣는다. 낮을수록 한도를 덜 쓴다
          LITE_AFTER_HOURS: "3"     # 좋은 모델이 막혔을 때, 올라온 지 이 시간이 지난 영상부터 lite 모델로 요약한다
        run: |
          pip install google-genai youtube-transcript-api yt-dlp pillow
          # 자막 시험용 쿠키: 저장소 밖(임시 폴더)에 만들어서 사이트에 절대 올라가지 않게 하고, 끝나면 지운다
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > "$RUNNER_TEMP/yt_cookies.txt"
            export YT_COOKIES_FILE="$RUNNER_TEMP/yt_cookies.txt"
          fi
          rc=0
          python scripts/summarize.py "$URLS" || rc=$?
          rm -f "$RUNNER_TEMP/yt_cookies.txt"
          exit $rc

      - name: 홈 대시보드와 검색용 개별 페이지 만들기 (브리핑·주간·종목, 사이트맵)
        if: ${{ !cancelled() }}
        env:
          SITE_URL: https://marketraven.kr
        run: |
          python3 -m pip install -q pillow || true   # 브리핑 공유 이미지용 (없으면 공통 이미지를 쓴다)
          python3 scripts/pages.py

      - name: 커뮤니티 데이터베이스 깨우기 (무료 Supabase가 1주일 쉬면 멈추는 것을 막는다)
        if: ${{ github.event_name == 'schedule' }}
        continue-on-error: true
        run: |
          if [ -f config.js ]; then
            URL=$(grep -o 'url:"[^"]*"' config.js | cut -d'"' -f2)
            KEY=$(grep -o 'key:"[^"]*"' config.js | cut -d'"' -f2)
            if [ -n "$URL" ] && [ -n "$KEY" ]; then
              curl -s -o /dev/null -w "Supabase 응답: %{http_code}\n" "$URL/rest/v1/posts?select=id&limit=1" -H "apikey: $KEY"
            fi
          fi

      - name: 변경사항 저장
        id: commit
        if: ${{ !cancelled() && github.event_name != 'push' }}
        env:
          SITE_URL: https://marketraven.kr
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in index.html videos.js briefs.js notes.js stocks.js state.json archive.json channels.json sitemap.xml pages.json brief week stock; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet -- index.html videos.js briefs.js notes.js stocks.js sitemap.xml brief week stock; then
            echo "videos=false" >> "$GITHUB_OUTPUT"
          else
            echo "videos=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "영상 요약 자동 갱신"
            # 실행 도중에 누가 파일을 올렸으면 그 내용을 먼저 받아 합친 뒤 저장한다 (최대 3번 시도)
            for i in 1 2 3; do
              if git push; then break; fi
              echo "저장소가 그사이 바뀌어서 최신 내용을 받아 합친 뒤 다시 저장한다 ($i/3)"
              if ! git pull --rebase --no-edit; then
                # 겹친 파일이 자동으로 다시 만드는 것(index.html, 브리핑·종목 페이지 등)뿐이면
                # 새로 올라온 쪽을 받은 뒤 요약 데이터로 다시 만들어서 합친다
                bad=$(git diff --name-only --diff-filter=U | grep -vE '^(index\.html|sitemap\.xml|pages\.json|(brief|week|stock)/)' || true)
                if [ -n "$bad" ]; then
                  git rebase --abort
                  echo "합치다가 충돌이 났다 ($bad). 이번 결과는 저장하지 못했다."; exit 1
                fi
                echo "자동으로 만드는 파일이 겹쳤다. 새로 올라온 쪽을 받고 페이지를 다시 만든다."
                git diff --name-only --diff-filter=U | xargs -r git checkout --ours --
                python3 scripts/pages.py
                git add index.html sitemap.xml pages.json brief week stock
                GIT_EDITOR=true git rebase --continue || { git rebase --abort; echo "합치지 못했다. 이번 결과는 저장하지 못했다."; exit 1; }
              fi
              sleep 3
            done
          fi

      - name: 데이터 파일에 버전 붙이기 (브라우저가 예전 파일을 계속 쓰지 않게)
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
        run: |
          V=$(date +%s)
          sed -i -E "s/(videos|briefs|notes|stocks|config)\.js(\?v=[0-9]+)?\"/\1.js?v=$V\"/g" index.html
          grep -o '<script src="[a-z]*\.js?v=[0-9]*"' index.html

      - uses: actions/configure-pages@v5
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}   # 다시 실행(Re-run)해도 이름이 겹치지 않게

      - id: deployment
        uses: actions/deploy-pages@v4
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.commit.outputs.videos == 'true' }}
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: 실패하면 텔레그램으로 알리기
        if: ${{ failure() }}
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ]; then
            curl -s -o /dev/null "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=[Market Raven 알림] 자동 실행이 실패했다. 로그: ${RUN_URL}" || true
          fi
