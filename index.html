<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경제 유튜브 요약</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14181f;--sub:#5d6573;--line:#e1e4ea;--accent:#2457f5;--chip:#eef1f7}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#181c24;--ink:#eef1f6;--sub:#9aa3b2;--line:#272d38;--accent:#7b99ff;--chip:#222833}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.lead{color:var(--sub);margin:0 0 24px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.bar input{flex:1 1 220px;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#dbe3f4,#b9c6e6);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px}
.meta{display:flex;gap:10px;font-size:.85rem;color:var(--sub)}
.meta b{color:var(--accent);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tags span{background:var(--chip);padding:2px 10px;border-radius:99px;font-size:.8rem}
.empty{color:var(--sub);padding:40px 0;text-align:center}
.more{grid-column:1/-1;text-align:center;padding:8px 0}
dialog{width:min(720px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(10,14,22,.55)}
.dlg{padding:24px 26px 28px}
.card p{margin:0;color:var(--ink);font-size:1.12rem;font-weight:800;line-height:1.5;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card h2{font-size:.85rem;line-height:1.45;margin:0;font-weight:400;color:var(--sub);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dlg .concl{font-size:1.3rem;font-weight:800;line-height:1.45;letter-spacing:-.01em;margin:10px 0 6px}
.dlg .dtitle{font-size:.88rem;color:var(--sub);line-height:1.45;margin:0 0 18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;background:var(--card);margin:0 -26px;padding:0 22px}
.tab{padding:10px 16px;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;background:none;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.pane h3{font-size:1.08rem;font-weight:800;margin:26px 0 8px;padding-left:10px;border-left:4px solid var(--accent)}
.pane h3.first{margin-top:18px}
.pane ul{list-style:none;margin:0;padding:0}
.pane li{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:12px;align-items:start;padding:9px 0;line-height:1.65}
.pane li .tm{margin:3px 0 0;justify-self:end}
.sec{scroll-margin-top:56px}
.sec+.sec{margin-top:34px;padding-top:6px;border-top:1px solid var(--line)}
@media(max-width:480px){.pane li{grid-template-columns:minmax(0,1fr) 70px;gap:8px}}
.tm{display:inline-block;margin-left:6px;padding:1px 9px;border-radius:99px;background:var(--chip);color:var(--sub);font-size:.78rem;font-weight:600;text-decoration:none;white-space:nowrap;vertical-align:1px}
a.tm:hover{color:var(--accent)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:12px}
.sc{background:var(--chip);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.sc b{font-size:1.02rem}
.sc p{margin:0;font-size:.9rem;color:var(--sub);line-height:1.55}
.sc .tm{align-self:flex-start;margin:4px 0 0;background:var(--card)}
.sc .big{font-size:1.45rem;font-weight:800;color:var(--accent);line-height:1.25}
.actions{display:flex;gap:10px;margin-top:24px}
.btn{display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}
.dlg a.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;margin:0}
.brief{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;margin:0 0 30px}
.bhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:.85rem;color:var(--sub)}
.bhead>b{color:var(--accent);font-weight:800;font-size:.95rem}
.bdates{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.bdates button,#btog{border:1px solid var(--line);background:none;color:var(--sub);border-radius:99px;padding:3px 11px;font:inherit;font-size:.8rem;cursor:pointer}
.bdates button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.brief h2{font-size:1.5rem;line-height:1.4;font-weight:800;letter-spacing:-.02em;margin:14px 0 10px}
.bover{margin:0 0 4px;color:var(--ink);line-height:1.7;font-size:1rem}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px;margin-top:22px}
.bb{margin-top:22px}.bgrid .bb{margin-top:0}
.bb h3{font-size:.95rem;font-weight:800;margin:0 0 12px;padding-left:10px;border-left:4px solid var(--accent)}
.bi{margin:0 0 16px}
.bi b{display:block;font-size:1rem;margin-bottom:3px}
.bi p,.sk p{margin:0 0 6px;line-height:1.6;font-size:.93rem}
.src{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.src button{border:0;background:var(--chip);color:var(--sub);border-radius:99px;padding:1px 9px;font:inherit;font-size:.76rem;font-weight:600;cursor:pointer}
.src button:hover{color:var(--accent)}
.skg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sk{background:var(--chip);border-radius:12px;padding:14px}
.skh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.skh b{font-size:1.02rem}.skh small{color:var(--sub);font-size:.78rem}
.bnote{color:var(--sub);font-size:.78rem;margin:20px 0 0}
.note{color:var(--sub);font-size:.82rem;margin-top:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>경제 유튜브 요약</h1>
  <p class="lead">인기 경제 채널의 영상을 AI가 요약하고, 하루치를 종합한 브리핑을 함께 보여 준다. 카드를 누르면 상세 요약과 장면별 시간을 볼 수 있다.</p>
  <section id="brief"></section>
  <div class="bar">
    <input id="q" type="search" placeholder="제목, 키워드로 검색" aria-label="검색">
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <p class="note">AI가 요약한 내용이라 오류가 있을 수 있다. 투자 권유가 아니며, 정확한 내용은 원본 영상에서 확인해야 한다. 영상과 썸네일의 저작권은 각 채널에 있다.</p>
</div>
<dialog id="dlg"></dialog>
<script src="videos.js"></script>
<script src="briefs.js"></script>
<script>
/* ===== 여기부터는 건드리지 않아도 된다 ===== */
if(typeof VIDEOS==="undefined"){document.querySelector("#grid").innerHTML='<div class="empty">영상 목록(videos.js)을 불러오지 못했다. index.html과 videos.js가 같은 폴더에 있는지 확인해야 한다.</div>';throw new Error("videos.js를 찾을 수 없다")}
VIDEOS.sort((a,b)=>b.date.localeCompare(a.date));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vid=u=>(u.match(/(?:v=|youtu\.be\/)([\w-]{11})/)||[])[1];
const sec=t=>t.split(":").reduce((a,b)=>a*60+ +b,0);
let ch="전체",q="",shown=12;const PAGE=12;
const chans=["전체",...new Set(VIDEOS.map(v=>v.channel))];
function chips(){$("#chips").innerHTML=chans.map(c=>`<button class="chip" aria-pressed="${c===ch}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function thumb(v){const id=vid(v.url);return id?`<img src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.remove()">`:""}
function card(i,f){const v=VIDEOS[i];return `<article class="card${f?" feature":""}" tabindex="0" data-i="${i}"><div class="thumb">${thumb(v)}</div><div class="body"><div class="meta"><b>${esc(v.channel)}</b><span>${esc(v.date.replace(/-/g,"."))}</span></div><p>${esc(v.conclusion)}</p><h2>${esc(v.title)}</h2><div class="tags">${v.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div></div></article>`}
function render(){
 const idx=VIDEOS.map((v,i)=>i).filter(i=>{const v=VIDEOS[i];return (ch==="전체"||v.channel===ch)&&(!q||(v.title+v.conclusion+v.tags.join(" ")).toLowerCase().includes(q))});
 $("#grid").innerHTML=idx.length?idx.slice(0,shown).map(i=>card(i)).join("")+(idx.length>shown?`<div class="more"><button class="btn" id="more">더 보기 (${idx.length-shown}편 남음)</button></div>`:""):`<div class="empty">조건에 맞는 영상이 없다. 다른 키워드나 채널을 골라보자.</div>`;
}
function open(i){
 const v=VIDEOS[i],id=vid(v.url),base=id?`https://www.youtube.com/watch?v=${id}`:"";
 const tm=t=>!t?"":base?`<a class="tm" href="${base}&t=${sec(t)}s" target="_blank" rel="noopener">▶ ${t}</a>`:`<span class="tm">${t}</span>`;
 const item=(t,x)=>{const k=x.search(/[:：]/),h=k>0&&k<40;return `<li><span>${h?`<b>${esc(x.slice(0,k+1))}</b> ${esc(x.slice(k+1).trim())}`:esc(x)}</span>${tm(t)}</li>`};
 const p1=(v.parts||[]).map((p,n)=>`<h3${n?"":' class="first"'}>${esc(p.t)}</h3><ul>${p.items.map(([t,x])=>item(t,x)).join("")}</ul>`).join("")||`<p class="empty">상세 요약은 아직 준비 중이다.</p>`;
 const st=(v.stocks||[]).map(([t,n,x])=>`<div class="sc"><b>${esc(n)}</b><p>${esc(x)}</p>${tm(t)}</div>`).join("");
 const nu=(v.numbers||[]).map(([t,n,x])=>`<div class="sc"><span class="big">${esc(n)}</span><p>${esc(x)}</p>${tm(t)}</div>`).join("");
 const p2=(st?`<h3 class="first">언급된 종목</h3><div class="sgrid">${st}</div>`:"")+(nu?`<h3${st?"":' class="first"'}>주요 숫자</h3><div class="sgrid">${nu}</div>`:"");
 $("#dlg").innerHTML=`<div class="dlg"><div class="meta"><b>${esc(v.channel)}</b><span>${esc(v.date.replace(/-/g,"."))}</span>${v.people?`<span>출연 ${esc(v.people)}</span>`:""}</div><p class="concl">${esc(v.conclusion)}</p><p class="dtitle">${esc(v.title)}</p>${p2?`<div class="tabs" role="tablist"><button class="tab on" role="tab" data-p="0">요약</button><button class="tab" role="tab" data-p="1">종목·숫자</button></div>`:""}<section class="pane sec" id="s0">${p1}</section>${p2?`<section class="pane sec" id="s1">${p2}</section>`:""}<div class="actions">${base?`<a class="btn main" href="${base}" target="_blank" rel="noopener">원본 영상 보기</a>`:""}<button class="btn" id="x">닫기</button></div></div>`;
 $("#dlg").showModal();$("#dlg").scrollTop=0;$("#dlg").onscroll=spy;$("#x").onclick=()=>$("#dlg").close();
}
function mark(n){$('.tab[data-p="0"]').className="tab"+(n===0?" on":"");$('.tab[data-p="1"]').className="tab"+(n===1?" on":"")}
function spy(){const d=$("#dlg"),s1=$("#s1");if(!s1)return;const atEnd=d.scrollTop+d.clientHeight>=d.scrollHeight-4;mark(atEnd||s1.getBoundingClientRect().top-d.getBoundingClientRect().top<140?1:0)}
function tab(n){mark(n);const t=$("#s"+n);if(t&&t.scrollIntoView)t.scrollIntoView({behavior:"smooth",block:"start"})}
/* ----- 종합 브리핑 ----- */
let bi=0,bopen=true;
const idx={};
VIDEOS.forEach((v,i)=>{const k=vid(v.url);if(k)idx[k]=i});
const src=ids=>{const o=[];(ids||[]).forEach(k=>{if(idx[k]!==undefined&&!o.includes(k))o.push(k)});return o.length?`<span class="src">${o.map(k=>`<button data-v="${idx[k]}">${esc(VIDEOS[idx[k]].channel)}</button>`).join("")}</span>`:""};
function brief(){
 const el=$("#brief");
 if(typeof BRIEFS==="undefined"||!BRIEFS.length){el.innerHTML="";return}
 const b=BRIEFS[bi],today=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
 const dates=BRIEFS.slice(0,7).map((x,i)=>`<button data-b="${i}" class="${i===bi?"on":""}">${esc(x.date.slice(5).replace("-","."))}</button>`).join("");
 const blk=(t,body)=>body?`<div class="bb"><h3>${t}</h3>${body}</div>`:"";
 const th=(b.themes||[]).map(t=>`<div class="bi"><b>${esc(t.title)}</b><p>${esc(t.summary)}</p>${src(t.refs)}</div>`).join("");
 const ag=(b.agreements||[]).map(a=>`<div class="bi"><p>${esc(a.point)}</p>${src(a.refs)}</div>`).join("");
 const dg=(b.disagreements||[]).map(d=>`<div class="bi"><b>${esc(d.topic)}</b>${d.views.map(v=>`<p>${src([v.ref])} ${esc(v.view)}</p>`).join("")}</div>`).join("");
 const sk=(b.stocks||[]).map(s=>`<div class="sk"><div class="skh"><b>${esc(s.name)}</b><small>${s.count}편에서 언급</small></div>${s.mentions.slice(0,4).map(m=>`<p>${src([m.ref])} ${esc(m.view)}</p>`).join("")}</div>`).join("");
 const head=`<div class="bhead"><b>${b.date===today?"오늘의 시장 브리핑":"시장 브리핑"}</b><span>${esc(b.date.replace(/-/g,"."))} · 영상 ${b.count}편 종합</span><button id="btog">${bopen?"접기":"펼치기"}</button><span class="bdates">${dates}</span></div><h2>${esc(b.headline)}</h2>`;
 const body=bopen?`<p class="bover">${esc(b.overview)}</p><div class="bgrid">${blk("핵심 주제",th)}${blk("공통으로 말한 것",ag)}${blk("엇갈린 의견",dg)}</div>${blk("여러 영상에서 언급된 종목",sk?`<div class="skg">${sk}</div>`:"")}<p class="bnote">AI가 이날의 영상 요약들을 종합한 내용이며 투자 권유가 아니다. 채널 이름을 누르면 근거가 된 영상의 요약을 볼 수 있다.</p>`:"";
 el.innerHTML=`<div class="brief">${head}${body}</div>`;
}
$("#q").oninput=e=>{q=e.target.value.trim().toLowerCase();shown=PAGE;render()};
$("#chips").onclick=e=>{const b=e.target.closest(".chip");if(b){ch=b.dataset.c;shown=PAGE;chips();render()}};
$("#grid").onclick=e=>{if(e.target.id==="more"){shown+=PAGE;render();return}const c=e.target.closest(".card");if(c)open(+c.dataset.i)};
$("#grid").onkeydown=e=>{if(e.key==="Enter"){const c=e.target.closest(".card");if(c)open(+c.dataset.i)}};
$("#dlg").onclick=e=>{const b=e.target.closest&&e.target.closest(".tab");if(b){tab(+b.dataset.p);return}if(e.target===$("#dlg"))$("#dlg").close()};
$("#brief").onclick=e=>{const v=e.target.closest("[data-v]");if(v){open(+v.dataset.v);return}const d=e.target.closest("[data-b]");if(d){bi=+d.dataset.b;brief();return}if(e.target.closest("#btog")){bopen=!bopen;brief()}};
if(typeof BRIEFS!=="undefined")BRIEFS.sort((a,b)=>b.date.localeCompare(a.date));
chips();render();brief();
</script>
</body>
</html>
